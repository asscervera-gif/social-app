name: Social
options:
  bundleIdPrefix: com.social.app
  deploymentTarget:
    iOS: "16.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  # "Directo" (0056_live_streams.sql) -- LiveKit (WebRTC, Apache 2.0,
  # SDKs open-source), motor elegido explícitamente por el usuario
  # (LiveKit Cloud, frente a self-hosted) para no montar infraestructura
  # propia de streaming en vivo. Requiere iOS 13+ (Package.swift real del
  # SDK), muy por debajo del deployment target real de este proyecto (16.0).
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.16.0"

targets:
  Social:
    type: application
    platform: iOS
    sources:
      - path: Social
        excludes:
          - "Backend/Config.example.plist"
    resources:
      - path: Social/Backend/Config.plist
        optional: true
      # Hallazgo real, legalmente relevante: la política de privacidad
      # existía como documento del repositorio pero nunca se mostraba
      # dentro de la app (ver PrivacyPolicyView.swift). Nota de
      # mantenimiento: si se edita legal/privacy_policy_es.md, hay que
      # volver a copiarlo aquí — no se lee en vivo del repositorio.
      - path: Social/privacy_policy_es.md
      - path: Social/terms_of_service_es.md
    dependencies:
      - package: Supabase
        product: Supabase
      - package: LiveKit
        product: LiveKit
    info:
      path: Social/Info.plist
      properties:
        CFBundleDisplayName: SOCIAL
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Hallazgo real GRAVE (encontrado por fin gracias al CI real,
        # 2026-08-24 — no solo un problema de CI, habría fallado igual en
        # un dispositivo físico o en Xcode local): `xcodegen generate`
        # ESCRIBE Social/Info.plist en esta misma ruta a partir SOLO de
        # las claves listadas aquí abajo — el archivo committeado en el
        # repo con los textos reales de permisos (NSCameraUsageDescription
        # etc.) se sobreescribía en cada `xcodegen generate`, perdiendo
        # todas las claves que no estuvieran también aquí. Confirmado en
        # el log real del sistema: "This app has crashed because it
        # attempted to access privacy-sensitive data without a usage
        # description... NSCameraUsageDescription" — un crash real de
        # verdad, no solo de CI. Todas las claves movidas aquí, texto
        # idéntico al que ya existía en Social/Info.plist.
        NSNearbyInteractionUsageDescription: "SOCIAL usa la interacción cercana para medir la distancia y dirección de las personas a tu alrededor y mostrarte su avatar en la cámara."
        NSBluetoothAlwaysUsageDescription: "SOCIAL usa Bluetooth para descubrir e intercambiar de forma segura la información inicial con otros dispositivos cercanos antes de medir la distancia."
        NSLocationWhenInUseUsageDescription: "SOCIAL usa tu ubicación para detectar si estás dentro de un evento activo (Modo Evento) y, si lo activas, para mostrarte en el mapa de \"Find\"."
        # Ampliado esta pasada (0056_live_streams.sql): antes solo
        # mencionaba el uso real de UWB/notas de voz -- ahora un directo
        # real también pide cámara/micrófono para publicar, mismo criterio
        # de honestidad ya aplicado a NSLocationWhenInUseUsageDescription
        # cuando se quitó la brújula.
        NSCameraUsageDescription: "SOCIAL usa la cámara para mostrarte, en tiempo real, el avatar de las personas que tienes cerca cuando enfocas hacia ellas, y para publicar vídeo cuando empiezas un directo."
        NSMicrophoneUsageDescription: "SOCIAL usa el micrófono para grabar notas de voz en el chat y para publicar audio cuando empiezas un directo."
        NSLocalNetworkUsageDescription: "SOCIAL usa la red local para descubrir a otras personas cercanas con la app abierta, antes de medir la distancia real por UWB."
        NSBonjourServices:
          - _social-uwb._tcp
          - _social-uwb._udp
        # Necesario para que PushTokenManager reciba avisos con la app en
        # segundo plano, no solo en primer plano (App/AppDelegate.swift).
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Social/Social.entitlements
      properties:
        # "development" hasta que exista una cuenta Apple Developer de pago
        # real y un build de producción firmado -- ver aviso de honestidad
        # en supabase/functions/send-push/index.ts (APNS_HOST también
        # apunta a producción, api.push.apple.com, para cuando llegue ese
        # paso). Sin DEVELOPMENT_TEAM real (CI usa firma automática sin
        # equipo, "solo compilador + Simulador"), este entitlement no tiene
        # efecto en Simulator más allá de permitir compilar y probar la
        # petición de permiso -- APNs real en Simulator (iOS 16+) requiere
        # una sesión de Apple ID iniciada ahí, fuera del alcance de CI.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.social.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        # Hallazgo real (CI real, GitHub Actions, 2026-08-24): al añadir el
        # primer Assets.xcassets del proyecto (AccentColor + social_logo),
        # Xcode empezó a exigir un app icon set llamado "AppIcon" que nunca
        # se ha diseñado ("None of the input catalogs contained a matching
        # ... app icon set named 'AppIcon'") — sin catálogo de assets antes,
        # esa comprobación ni se activaba. Un icono de app real (1024x1024,
        # sin transparencia, pensado como icono) es trabajo de diseño
        # aparte, no algo a fabricar deprisa a partir del logo/wordmark
        # existente solo para que compile. Desactivado explícitamente hasta
        # que exista un icono real — pendiente documentado, no fingido.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Hallazgo real (captura de pantalla real, 2026-08-24): el color
        # "AccentColor" existe en Assets.xcassets pero el botón seguía en
        # azul del sistema — a diferencia de un proyecto creado desde el
        # asistente de Xcode (que fija esto automáticamente), un proyecto
        # generado con XcodeGen necesita este build setting explícito para
        # que "AccentColor" se use de verdad como tinte global de la app.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
