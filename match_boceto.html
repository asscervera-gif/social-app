<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SOCIAL — Boceto: Match</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  body{background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;}
  .phone{width:375px;height:812px;background:#F4F6F8;border-radius:44px;border:10px solid #1c1c1e;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .scroll{position:absolute;top:0;left:0;right:0;bottom:58px;overflow-y:auto;}
  h1.title{font-size:19px;font-weight:800;color:#111;padding:16px 16px 10px;background:#fff;}
  .search{margin:0 16px 10px;background:#F1F3F5;border-radius:14px;padding:10px 14px;font-size:13px;color:#888;}
  .chips{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto;}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:14px;font-size:12px;font-weight:600;background:#F1F3F5;color:#555;white-space:nowrap;}
  .chip.active{background:#111;color:#fff;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px;}
  .card{aspect-ratio:0.8;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(160deg,#A5D8FF,#D0BFFF);}
  .card-avatar{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:50%;border:2px solid #fff;
    display:flex;align-items:center;justify-content:center;font-size:16px;background:#fff;}
  .card-compat{position:absolute;top:10px;right:10px;background:#20BF6B;color:#fff;font-size:10.5px;font-weight:700;
    padding:4px 8px;border-radius:9px;}
  .card-compat.priv{background:rgba(255,255,255,.85);color:#888;}
  .card-name{position:absolute;bottom:10px;left:10px;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.5);}
  .nav{position:absolute;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid #E9ECEF;display:flex;align-items:center;z-index:30;}
  .nav .n{flex:1;text-align:center;color:#BBBBBB;font-size:7.5px;}
  .nav .n.active{color:#111;}
  .nav .n .ic{font-size:18px;display:block;margin-bottom:2px;}
  .slogo{font-size:24px;font-weight:300;line-height:1;
    background:linear-gradient(90deg,#FF3B3B,#F7B731,#20BF6B,#4DABF7,#A55EEA);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
</style>
</head>
<body>
<div class="phone">
  <div class="scroll">
    <h1 class="title">🔍 Match</h1>
    <div class="search">🔍 Buscar por intereses, ciudad, gustos...</div>
    <div class="chips">
      <div class="chip active">Cerca</div>
      <div class="chip">Compatibles</div>
      <div class="chip">Nuevos</div>
      <div class="chip">Tus gustos</div>
    </div>
    <div class="grid">
      <div class="card" style="background:linear-gradient(160deg,#FFD8A8,#FFA8A8);">
        <div class="card-avatar">🦊</div><div class="card-compat">92%</div><div class="card-name">Álex</div>
      </div>
      <div class="card" style="background:linear-gradient(160deg,#A5D8FF,#D0BFFF);">
        <div class="card-avatar">🐼</div><div class="card-compat priv">?%</div><div class="card-name">Marta</div>
      </div>
      <div class="card" style="background:linear-gradient(160deg,#B2F2BB,#96F2D7);">
        <div class="card-avatar">🦁</div><div class="card-compat">78%</div><div class="card-name">Leo</div>
      </div>
      <div class="card" style="background:linear-gradient(160deg,#FFC9DE,#EEBEFA);">
        <div class="card-avatar">🐨</div><div class="card-compat priv">?%</div><div class="card-name">Nora</div>
      </div>
    </div>
  </div>
  <div class="nav">
    <div class="n"><span class="ic">🏠</span>Home</div>
    <div class="n active"><span class="ic">🔍</span>Match</div>
    <div class="n"><span class="slogo">S</span></div>
    <div class="n"><span class="ic">🔔</span>Avisos</div>
    <div class="n"><span class="ic">👤</span>Perfil</div>
  </div>
</div>
<script>if(location.hash==='#embed'){document.querySelectorAll('.nav').forEach(n=>n.style.display='none');}</script>
</body>
</html>
