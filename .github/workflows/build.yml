# .github/workflows/build.yml
#
# Compila SOCIAL en un runner macOS de GitHub Actions — esta es la vía real
# para verificar que el proyecto compila sin tener un Mac propio. No firma
# ni sube a App Store (eso requiere un Apple Developer Program de pago y
# certificados); solo compila para el simulador, que basta para detectar
# errores de sintaxis/dependencias.
#
# Coste: GitHub da minutos gratis limitados en repos privados; los runners
# macOS consumen minutos a 10x respecto a Linux. Repos públicos son gratis.

name: Build SOCIAL (simulador)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      # Hallazgo real (2026-08-24, primeros 2 fallos reales de CI): el
      # Xcode por defecto del runner YA era 15.4, y aun así XcodeGen
      # generaba un .pbxproj en formato de proyecto 77 ("future Xcode
      # project file format") — XcodeGen fija ese formato en su propio
      # binario, no según el Xcode activo, y 77 es más nuevo que lo que
      # Xcode 15.4 sabe abrir. La única versión de Xcode que puede abrir
      # ese formato es la más reciente instalada en el runner (macos-14
      # trae varias) — se selecciona explícitamente antes de generar, en
      # vez de asumir cuál es "la" versión correcta.
      - name: Seleccionar la versión de Xcode más reciente disponible
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Usando: $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Generar Social.xcodeproj
        run: xcodegen generate

      # Config.plist real está en .gitignore (credenciales) — sin esto,
      # SupabaseManager.swift hace fatalError() al arrancar (por diseño,
      # ver el comentario en ese archivo) y ni siquiera se podría lanzar
      # en el simulador para la captura de pantalla de abajo. Credenciales
      # de relleno, no reales — solo para que la app arranque en CI; las
      # llamadas reales a Supabase fallarán limpiamente (cada ViewModel ya
      # captura el error y lo muestra, no hay ningún crash esperado por eso).
      - name: Crear Config.plist de CI (credenciales de relleno, no reales)
        run: |
          cat > Social/Backend/Config.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>SUPABASE_URL</key>
              <string>https://ci-placeholder.supabase.co</string>
              <key>SUPABASE_ANON_KEY</key>
              <string>ci-placeholder-anon-key</string>
          </dict>
          </plist>
          EOF

      # "generic/platform=iOS Simulator" compila para el SDK del
      # simulador sin necesitar que exista un dispositivo concreto (p.ej.
      # "iPhone 15") ya creado en el runner — evita otro acoplamiento a un
      # nombre de simulador que puede no existir según qué Xcode termine
      # siendo el por defecto.
      - name: Compilar para el simulador
        run: |
          xcodebuild build \
            -project Social.xcodeproj \
            -scheme Social \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # No es un test funcional (las llamadas a Supabase apuntan a un host
      # de relleno y fallarán) — es la única verificación visual posible
      # sin un Mac físico ni un iPhone real: confirma que la app arranca,
      # SwiftUI renderiza sin fatalError/crash de layout, y deja una
      # captura real como prueba en vez de solo "compiló".
      - name: Lanzar en el Simulador y capturar pantalla
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | \
            /usr/bin/python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for rt in d.values() for dev in rt if dev['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find build/Build/Products -maxdepth 3 -iname "Social.app" | head -1)
          xcrun simctl install "$UDID" "$APP_PATH"
          # Hallazgo real (primera pantalla capturada, 2026-08-24): 8s no
          # bastaban tras un arranque en frío del simulador (el propio
          # `bootstatus` tardó ~15s solo en "Data Migration") — la captura
          # salió mostrando la pantalla de inicio de iOS, no la app, porque
          # SpringBoard todavía no había procesado el `launch`. Se relanza
          # una segunda vez justo antes de capturar, con más margen.
          # Hallazgo real (confirmado con el log real del sistema, no una
          # suposición): un solo `launch` SÍ llega a primer plano de
          # verdad — SpringBoard registra
          # "visibility: Foreground"/"Window did become application key"
          # con normalidad. Relanzar una segunda vez (intento anterior)
          # interrumpía esa transición justo antes de la captura, que es
          # lo que realmente causaba la pantalla de inicio en las 2
          # capturas previas — no timing insuficiente, sino un relanzamiento
          # innecesario.
          xcrun simctl launch "$UDID" com.social.app
          sleep 15
          mkdir -p artifacts
          xcrun simctl io "$UDID" screenshot artifacts/social-ios-simulator.png

      # Diagnóstico de reserva, solo si algo vuelve a fallar (ver el
      # historial de commits de este archivo, 2026-08-24, para el proceso
      # real que ya se siguió con esto: confirmó vía el log real del
      # sistema que la app SÍ llega a primer plano — "visibility:
      # Foreground" en SpringBoard — el problema era un relanzamiento
      # innecesario, ya corregido arriba, no timing ni crash).
      - name: Diagnóstico si el lanzamiento vuelve a fallar
        if: failure()
        run: |
          REPORTS="$HOME/Library/Logs/DiagnosticReports"
          if ls "$REPORTS"/Social-*.ips >/dev/null 2>&1; then
            for f in "$REPORTS"/Social-*.ips; do echo "--- $f ---"; cat "$f"; done
          else
            echo "Sin informe de crash para Social en $REPORTS"
          fi
          UDID=$(xcrun simctl list devices available -j | \
            /usr/bin/python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for rt in d.values() for dev in rt if dev['name'].startswith('iPhone')))")
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "Social" OR eventMessage CONTAINS "Social"' --style compact 2>&1 | tail -150

      - name: Subir captura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-ios-simulator-screenshot
          path: artifacts/social-ios-simulator.png
          if-no-files-found: warn
